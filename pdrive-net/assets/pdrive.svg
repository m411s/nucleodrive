<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- pdrive app icon: a cloud with a two-way sync loop on a purple tile in the app's accent
       colours. Original artwork for this unofficial app; not Proton's logo (no "P", no Drive folder shape). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A08BFF"/>
      <stop offset="0.5" stop-color="#6D4AFF"/>
      <stop offset="1" stop-color="#4A2BD9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="loop" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="12.5" stroke-linecap="round">
        <path d="M101.92 139.01 A27 27 0 0 1 148.06 127.93"/>
        <path d="M154.08 152.99 A27 27 0 0 1 107.94 164.07"/>
      </g>
      <g fill="#000">
        <path d="M156.80 137.63 L154.21 118.50 L138.04 133.06 Z"/>
        <path d="M99.20 154.37 L101.79 173.50 L117.96 158.94 Z"/>
      </g>
    </mask>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#shine)"/>
  <g transform="translate(128 132) scale(0.88) translate(-128 -132)">
    <path d="M78 188 C55 188 40 172 40 152 C40 133 54 118 73 116 C78 89 101 70 129 70 C157 70 179 89 184 115 C203 117 216 132 216 151 C216 172 200 188 179 188 Z" fill="#ffffff" mask="url(#loop)"/>
  </g>
</svg>
