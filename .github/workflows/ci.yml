# Build and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nucleodrive-net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: nucleodrive-net/global.json

      - name: Restore
        run: dotnet restore

      # test.sh builds, then runs the xUnit v3 test programs directly (see README).
      - name: Build and test
        run: ./test.sh

      - name: Shell scripts parse
        run: |
          bash -n install.sh uninstall.sh package.sh test.sh assets/make-tray-icons.sh
          sh -n packaging/appimage/AppRun
