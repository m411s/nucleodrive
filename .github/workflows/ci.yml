# Build and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pdrive-net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: pdrive-net/global.json

      - name: Restore
        run: dotnet restore

      # test.sh builds, then runs the xUnit v3 test programs directly (see README).
      - name: Build and test
        run: ./test.sh

      - name: Shell scripts parse
        run: |
          bash -n install.sh uninstall.sh package.sh test.sh assets/make-tray-icons.sh
          sh -n packaging/appimage/AppRun
