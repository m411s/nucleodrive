# Builds the .deb and AppImage with package.sh.
#   - Push a tag like v0.2.0  → tests, packages, and a GitHub Release with both files + SHA256SUMS.
#   - Run it by hand (Actions › Release › Run workflow) → tests and packages only, kept as a
#     downloadable workflow artifact; no release is created.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04 # x86_64 (package.sh pins appimagetool for x86_64)
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # build provenance (signed by GitHub's Sigstore instance)
      attestations: write
    defaults:
      run:
        working-directory: nucleodrive-net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: nucleodrive-net/global.json

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            case "$v" in [0-9]*) ;; *) echo "Tag must look like v1.2.3, got ${GITHUB_REF_NAME}" >&2; exit 1 ;; esac
          else
            v="0.0.0~ci$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Test
        run: ./test.sh

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAINTAINER: "NucleoDrive (unofficial Proton Drive client) <noreply@github.com>"
        run: |
          ./package.sh
          cd dist
          sha256sum *.deb *.AppImage > SHA256SUMS
          ls -l *.deb *.AppImage SHA256SUMS

      - name: Check the packages
        run: |
          cd dist
          dpkg-deb -I *.deb | grep -E "Package|Version|Architecture"
          chmod +x *.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/nucleodrive/nucleodrive-daemon
          test -f squashfs-root/usr/share/nucleodrive/icons/tray-idle.png
          ./squashfs-root/AppRun ctl --help >/dev/null
          rm -rf squashfs-root

      # Signed build provenance for each package: `gh attestation verify <file> -R <owner>/<repo>`.
      # GitHub only offers attestations for public repositories (or Enterprise Cloud), so this is
      # skipped while the repository is private.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag' && !github.event.repository.private
        with:
          subject-path: |
            nucleodrive-net/dist/*.deb
            nucleodrive-net/dist/*.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nucleodrive-${{ steps.version.outputs.version }}
          path: |
            nucleodrive-net/dist/*.deb
            nucleodrive-net/dist/*.AppImage
            nucleodrive-net/dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac   # v1.0.0-beta.1 etc.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "NucleoDrive $TAG" \
            --generate-notes $prerelease --notes "$(cat <<'EOF'
          Unofficial Linux client for Proton Drive. Not affiliated with Proton AG.
          For personal, non-commercial use, at your own risk: provided "as is", with no responsibility for any data loss. Keep backups.

          - **.deb** (Debian/Ubuntu): `sudo apt install ./nucleodrive_*.deb`; the sync service starts at your next login (or `systemctl --user start nucleodrive`).
          - **AppImage**: `chmod +x nucleodrive-*.AppImage` and run it; the first launch sets up the background service and login entry.
          - Check downloads with `sha256sum -c SHA256SUMS`, and where they were built with `gh attestation verify <file> -R m411s/nucleodrive`.

          The app installs Proton's official `proton-drive` CLI for you (Settings › Install the CLI), verified against Proton's published checksum.
          EOF
          )"
